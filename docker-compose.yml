# Servicios: PostgreSQL + backend Spring Boot + whatsapp-bridge (Baileys QR)
name: fruvercopilot

services:
  postgres:
    container_name: fruvercopilot-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fruver}
      POSTGRES_USER: ${DB_USER:-fruver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      # Solo localhost en desarrollo. En prod con proxy/Internet: quita este mapeo o usa firewall.
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  whatsapp-bridge:
    container_name: fruvercopilot-whatsapp-bridge
    build: ./whatsapp-bridge
    restart: unless-stopped
    environment:
      PORT: 3000
      AUTH_DIR: /app/auth_info
      BACKEND_WEBHOOK_URL: http://backend:8080/webhook/whatsapp
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-ignore}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fruver}
      DB_USER: ${DB_USER:-fruver}
      DB_PASSWORD: ${DB_PASSWORD}
    stop_grace_period: 30s
    ports:
      - "${WHATSAPP_BRIDGE_PORT:-8086}:3000"
    volumes:
      - whatsapp_auth:/app/auth_info

  backend:
    container_name: fruvercopilot-backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres      # nombre del servicio PostgreSQL dentro de la red de Docker
      DB_PORT: 5432          # puerto interno del contenedor de PostgreSQL (no el POSTGRES_PORT del host)
      AUDIO_STORAGE_PATH: /data/audio
      APP_WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3000
    ports:
      - "${APP_PORT:-8085}:${SERVER_PORT:-8080}"
    volumes:
      - audio_data:/data/audio
      - backend_ssh:/home/fruver/.ssh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  audio_data:
  whatsapp_auth:
  backend_ssh:
