# Servicios: PostgreSQL + backend Spring Boot (que ademas sirve la pantalla operativa).
# No se agregan Redis/RabbitMQ/MinIO: no resuelven ningun problema real de la v1 (ver README).
name: fruvercopilot

services:
  postgres:
    container_name: fruvercopilot-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fruver}
      POSTGRES_USER: ${DB_USER:-fruver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      # Solo localhost en desarrollo. En prod con proxy/Internet: quita este mapeo o usa firewall.
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: fruvercopilot-backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres      # nombre del servicio PostgreSQL dentro de la red de Docker
      DB_PORT: 5432          # puerto interno del contenedor de PostgreSQL (no el POSTGRES_PORT del host)
      AUDIO_STORAGE_PATH: /data/audio
    ports:
      - "${APP_PORT:-8085}:${SERVER_PORT:-8080}"
    volumes:
      - audio_data:/data/audio
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  audio_data:
