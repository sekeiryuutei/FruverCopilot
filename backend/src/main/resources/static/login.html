<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14361f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="El Oasis">
<title>Fruver El Oasis</title><link rel="icon" href="/oasis-logo.png"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/oasis-logo.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1a14;font-family:system-ui,sans-serif;color:#e9f2ec}
  form{background:#16261d;padding:28px;border-radius:14px;width:min(340px,90vw);display:grid;gap:12px;border:1px solid #274233}
  h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:8px} input{padding:12px;border-radius:8px;border:1px solid #33553f;background:#0f1a14;color:inherit;font-size:16px}
  button{padding:12px;border:0;border-radius:8px;background:#2fb767;color:#06210f;font-weight:700;font-size:16px;cursor:pointer}
  .err{color:#ff8c8c;font-size:14px;display:none}
</style></head><body>
<form method="post" action="/login">
  <h1><img src="/oasis-logo.png" alt="Oasis" style="height:36px;width:auto;border-radius:6px;object-fit:contain" onerror="this.style.display='none'"> Fruver El Oasis</h1>
  <input name="username" placeholder="Usuario" autocomplete="username" required autofocus>
  <input name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <div class="err" id="err">Usuario o contraseña incorrectos</div>
  <button type="submit">Entrar</button>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
