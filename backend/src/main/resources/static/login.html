<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FruverCopilot · Ingreso</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🥑%3C/text%3E%3C/svg%3E">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1a14;font-family:system-ui,sans-serif;color:#e9f2ec}
  form{background:#16261d;padding:28px;border-radius:14px;width:min(340px,90vw);display:grid;gap:12px;border:1px solid #274233}
  h1{margin:0 0 4px;font-size:22px} input{padding:12px;border-radius:8px;border:1px solid #33553f;background:#0f1a14;color:inherit;font-size:16px}
  button{padding:12px;border:0;border-radius:8px;background:#2fb767;color:#06210f;font-weight:700;font-size:16px;cursor:pointer}
  .err{color:#ff8c8c;font-size:14px;display:none}
</style></head><body>
<form method="post" action="/login">
  <h1>🥑 FruverCopilot</h1>
  <input name="username" placeholder="Usuario" autocomplete="username" required autofocus>
  <input name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <div class="err" id="err">Usuario o contraseña incorrectos</div>
  <button type="submit">Entrar</button>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
