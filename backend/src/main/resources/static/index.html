<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14361f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="El Oasis">
<title>Fruver El Oasis</title><link rel="icon" href="/oasis-logo.png"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/oasis-logo.png">
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#14231a;--mut:#607066;--line:#dbe3dd;--g:#1f9d55;--y:#d99a00;--r:#d33;--brand:#14361f;--bnav-h:64px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16261d;--ink:#e9f2ec;--mut:#93a89b;--line:#274233;--brand:#0a1f12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}

/* ── HEADER ──────────────────────────────────── */
header{background:var(--brand);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:25;box-shadow:0 2px 8px #0002;min-height:52px}
header .logo{font-size:18px;font-weight:700;letter-spacing:-0.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .hactions{display:flex;gap:6px;align-items:center;flex-shrink:0}
#printerBadge{font-size:11px;background:#1e3a5f;color:#93c5fd;font-weight:700;padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cnt{font-size:13px;white-space:nowrap}
/* nav de escritorio (tabs horizontales) */
#desktopNav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:none;max-width:100%}
#desktopNav::-webkit-scrollbar{display:none}
#desktopNav button{background:transparent;color:#cfe;border:1px solid #ffffff33;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;flex-shrink:0;font-weight:500;touch-action:manipulation}
#desktopNav button.on{background:#fff;color:#123;font-weight:700}

/* ── BOTTOM NAV (mobile) ─────────────────────── */
#bottomNav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--brand);z-index:50;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 12px #0004}
#bottomNav .bnav-inner{display:grid;height:var(--bnav-h)}
#bottomNav button{background:transparent;border:none;color:#8ec9a8;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;font-size:10px;font-weight:600;touch-action:manipulation;transition:color 0.15s}
#bottomNav button .ico{font-size:22px;line-height:1}
#bottomNav button.on{color:#fff}
#bottomNav button.on .ico{filter:drop-shadow(0 0 4px #6fffa844)}
/* body con espacio para bottom nav */
body.mobile-nav main{padding-bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0) + 8px)}
body.mobile-nav #toast{bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0) + 12px)}

/* ── BANNER INSTALAR PWA ─────────────────────── */
#installBanner{display:none;position:fixed;bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0));left:0;right:0;z-index:49;padding:10px 14px;background:linear-gradient(135deg,#166534,#14532d);border-top:2px solid #22c55e;box-shadow:0 -4px 20px #0005;align-items:center;gap:10px}
#installBanner .ibtext{flex:1;color:#fff;font-size:14px;font-weight:600;line-height:1.3}
#installBanner .ibtext small{display:block;font-weight:400;color:#86efac;font-size:12px;margin-top:2px}
#btnInstall{background:#22c55e;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap;flex-shrink:0}
#btnInstallClose{background:transparent;border:none;color:#86efac;font-size:20px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1}

/* ── MAIN ────────────────────────────────────── */
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;border-left:8px solid var(--line)}
.card.GREEN{border-left-color:var(--g)}.card.YELLOW{border-left-color:var(--y)}.card.RED{border-left-color:var(--r)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top .sp{flex:1}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.pill.GREEN{background:var(--g)}.pill.YELLOW{background:var(--y)}.pill.RED{background:var(--r)}.pill.gray{background:#7a8a80}
.msg{margin:8px 0;padding:9px 11px;background:var(--bg);border-radius:8px;font-style:italic;white-space:pre-wrap}
.banner{padding:8px 10px;border-radius:8px;background:#d3332222;color:var(--r);font-weight:700;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:left;vertical-align:middle}th{font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);min-width:0}
td input.pn{width:100%;min-width:140px}td input.q{width:78px}td input.pr{width:96px}
button.b{padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font-weight:600;touch-action:manipulation}
button.b.main{background:var(--g);border-color:var(--g);color:#fff;font-size:16px;padding:11px 18px}button.b.danger{color:var(--r)}
button.b:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.total{font-size:22px;font-weight:800}.prob{color:var(--r);font-size:12px}.ai{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conv{font-size:13px;background:var(--bg);border-radius:8px;padding:8px;margin-top:8px}.conv .out{color:var(--g)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:9px;display:none;z-index:999;max-width:90vw;text-align:center}
@keyframes fl{from{background:#2fb76766}to{background:transparent}}tr.flash{animation:fl 1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-loader{width:38px;height:38px;border:3.5px solid rgba(59,130,246,0.2);border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite}
.spinner-inline{display:inline-block;width:12px;height:12px;border:2px solid rgba(147,197,253,0.3);border-top-color:#93c5fd;border-radius:50%;animation:spin 0.75s linear infinite;vertical-align:middle}
.card.busy-card{border-left-color:#3b82f6}
@media (prefers-color-scheme:dark){
  .spin-loader{border-color:rgba(96,165,250,0.2);border-top-color:#60a5fa}
}
input.bad{border-color:var(--r);box-shadow:0 0 0 2px #d3332255}
h3{margin:18px 0 8px}.mut{color:var(--mut)}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,0.5);width:100%;max-width:850px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px;z-index:91}

/* ── MOBILE overrides ────────────────────────── */
@media(max-width:640px){
  #desktopNav{display:none!important}
  #bottomNav{display:block}
  body{padding-bottom:0}
  header{padding:8px 12px;min-height:48px}
  header .logo{font-size:16px}
  #printerBadge{font-size:10px;padding:3px 7px}
  .cnt{display:none}/* quitado del header; aparece en la tarjeta de operaciones */
  main{padding:8px}
  .card{padding:10px 11px;margin-bottom:10px;border-radius:10px;border-left-width:5px}
  .grid2{grid-template-columns:1fr}
  td input.pn{min-width:110px;font-size:14px}
  td input.q{width:60px;font-size:14px}
  td input.pr{width:74px;font-size:14px}
  td,th{padding:5px 2px;font-size:13px}
  button.b{padding:10px 13px;font-size:14px;min-height:44px;border-radius:10px}
  button.b.main{padding:12px 16px;font-size:15px;min-height:48px}
  .total{font-size:20px}
  .modal-overlay{padding:0}
  .modal-card{height:100dvh;max-height:100dvh;border-radius:0;border:none;padding:12px;padding-bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0) + 8px)}
  input,select,textarea{font-size:16px;/* previene zoom en iOS */}
  #logoutBtn{display:inline-flex;align-items:center;padding:5px 9px;font-size:12px;min-height:32px;background:#1b3824;border:1px solid #ffffff44;border-radius:6px;color:#fff}
}

</style></head><body>
<!-- ── Header ─────────────────────────────────────── -->
<header>
  <span class="logo" style="display:flex;align-items:center;gap:6px"><img src="/oasis-logo.png" alt="Oasis" style="height:28px;width:auto;border-radius:4px;object-fit:contain" onerror="this.style.display='none'"><b>Fruver El Oasis</b></span>
  <div class="hactions">
    <button id="btnHeaderInstall" class="b" style="display:none;padding:5px 9px;font-size:12px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-weight:700" title="Instalar app en tu pantalla de inicio">📲 Instalar</button>

  </div>

  <div id="desktopNav"></div>
</header>

<!-- ── Barra de Modo Sin Conexión (Offline Banner) ──── -->
<div id="offlineBar" style="display:none;background:#b45309;color:#fff;padding:8px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:52px;z-index:24;box-shadow:0 2px 8px rgba(0,0,0,0.25);text-align:center">
  <span>⚡ MODO SIN CONEXIÓN — Puedes seguir creando pedidos; se guardarán localmente y se sincronizarán al volver internet</span>
  <span id="offlineCount" class="pill" style="background:#78350f;color:#fef3c7;font-size:12px;font-weight:800;display:none">0 pendientes</span>
</div>

<!-- ── Banner de instalación PWA (bottom, mobile) ──── -->
<div id="installBanner">
  <div class="ibtext">

    <small>Funciona sin abrir el navegador</small>

<!-- ── Bottom nav (mobile) ────────────────────────── -->

<script>
const $=s=>document.querySelector(s);
const cop=n=>n==null?'—':'$'+Math.round(n).toLocaleString('es-CO');
const cleanPhone=p=>(p||'').replace(/^57(?=\d{10}$)/,'');
const num=v=>v===''||v==null?null:Number(v);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='checked'){e.checked=!!v;if(v)e.setAttribute('checked','')}else if(k==='dataset')Object.assign(e.dataset,v);else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}
function csrf(){return decodeURIComponent((document.cookie.match(/XSRF-TOKEN=([^;]+)/)||[])[1]||'')}

let isOffline = (typeof navigator !== 'undefined' && navigator.onLine === false);

function getOfflineOrders(){
  try{ return JSON.parse(localStorage.getItem('oasis_offline_orders') || '[]'); }catch(e){ return []; }
}
function saveOfflineOrder(order){
  try{
    const q = getOfflineOrders();
    q.push(order);
    localStorage.setItem('oasis_offline_orders', JSON.stringify(q));
    updateOfflineUI();
  }catch(e){}
}
function removeOfflineOrder(orderId){
  try{
    let q = getOfflineOrders();
    q = q.filter(o => o.id !== orderId);
    localStorage.setItem('oasis_offline_orders', JSON.stringify(q));
    updateOfflineUI();
  }catch(e){}
}
function updateOfflineUI(){
  const bar = $('#offlineBar');
  const countEl = $('#offlineCount');
  if(!bar) return;
  const q = getOfflineOrders();
  if(isOffline){
    bar.style.display = 'flex';
    bar.style.background = '#b45309';
    const msgSpan = bar.querySelector('span');
    if(msgSpan) msgSpan.textContent = '⚡ MODO SIN CONEXIÓN — Puedes seguir creando pedidos; se guardarán localmente y se sincronizarán al volver internet';
    else bar.textContent = '⚡ MODO SIN CONEXIÓN — Puedes seguir creando pedidos; se guardarán localmente y se sincronizarán al volver internet';
    if(countEl){
      countEl.style.display = q.length > 0 ? 'inline-block' : 'none';
      countEl.textContent = `${q.length} pendiente${q.length === 1 ? '' : 's'}`;
    }
  } else {
    if(q.length > 0){
      bar.style.display = 'flex';
      bar.style.background = '#065f46';
      const msgSpan = bar.querySelector('span');
      if(msgSpan) msgSpan.textContent = '🟢 Conexión restablecida — Sincronizando pedidos guardados...';
      if(countEl){
        countEl.style.display = 'inline-block';
        countEl.textContent = `${q.length} sincronizando`;
      }
    } else {
      bar.style.display = 'none';
    }
  }
}
function setOfflineState(state){
  const changed = isOffline !== state;
  isOffline = state;
  updateOfflineUI();
  return changed;
}

let isSyncing = false;
async function syncOfflineOrders(){
  if(isSyncing || (typeof navigator !== 'undefined' && !navigator.onLine)) return;
  const q = getOfflineOrders();
  if(!q.length) return;
  isSyncing = true;
  updateOfflineUI();
  let synced = 0;
  try{
    for(const off of [...q]){
      try{
        const order = await api('/api/orders/manual', { method: 'POST', body: off.rawPayload });
        if(off.andApprove){
          try{
            await api(`/api/orders/${order.id}/approve`, {
              method: 'POST',
              body: { version: order.version, deliveryPersonId: off.rawPayload.deliveryPersonId }
            });
          }catch(x){}
        }
        removeOfflineOrder(off.id);
        synced++;
      }catch(err){
        if(err.isOffline || (typeof navigator !== 'undefined' && !navigator.onLine)) break;
      }
    }
    if(synced > 0){
      toast(`✓ ¡Conexión restablecida! Se sincronizaron ${synced} pedido(s) guardados localmente.`);
      await loadOrders();
    }
  }finally{
    isSyncing = false;
    updateOfflineUI();
  }
}

async function api(path,opt={}){
  const o={method:'GET',headers:{},...opt};
  if(o.body&&typeof o.body!=='string'){o.body=JSON.stringify(o.body);o.headers['Content-Type']='application/json'}
  if(o.method!=='GET')o.headers['X-XSRF-TOKEN']=csrf();
  let r;
  try{
    r=await fetch(path,o);
    if(setOfflineState(false)){
      syncOfflineOrders();
    }
  }catch(fetchErr){
    setOfflineState(true);
    const customErr = new Error('Sin conexión a internet. Los datos se guardarán localmente.');
    customErr.code = 'OFFLINE';
    customErr.isOffline = true;
    throw customErr;
  }
  if(r.status===401){location='/login.html';throw new Error('401')}
  const j=r.status===204?null:await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(j?.message||'Error '+r.status);e.code=j?.code;e.details=j?.details;throw e}
  return j;
}
const S={me:null,products:[],orders:[],deliveryPersons:[],draft:{},open:{},openConvs:new Set(),tab:'ops'};
const byName=n=>S.products.find(p=>p.name.toLowerCase()===String(n).trim().toLowerCase());
const ago=t=>{const s=Math.max(0,(Date.now()-new Date(t))/1000);return s<60?Math.round(s)+' s':s<3600?Math.round(s/60)+' min':Math.round(s/3600)+' h'};

/* ---------- Operación ---------- */
/* PURE:START — lógica sin DOM (se prueba aparte con Node) */
const round3=n=>Math.round(n*1000)/1000;
/** Firma barata de un pedido: si no cambia, su tarjeta NO se vuelve a dibujar (sin parpadeo). */
function orderSig(o){return JSON.stringify([o.version,o.status,o.reviewStatus,o.conversationStatus,o.aiStatus,o.printStatus,o.saleId,o.total,
  o.suggestedReply,o.confirmationDraft,o.messageText,o.customer?.name,o.customer?.type,o.address,o.notes,o.deliveryPersonId||null,o.deliveryPersonName||null,o.dispatchedAt||null,o.messageCount||0,o.pendingDispatchOrderId||null,
  o.hasImage||false,o.requiresVerification||false,o.verificationReason||null,o.printedPrinter||null,o.targetPrinter||null,
  (o.items||[]).map(i=>[i.id,i.productId,i.quantity,i.unit,i.manualPrice,i.problem])])}
/** Otra línea del pedido con el mismo producto y la misma unidad (el precio es por unidad del producto). */
function findTwin(items,it){return items.find(x=>x!==it&&x.productId&&x.productId===it.productId&&x.unit===it.unit)}
/** Suma a `twin` la cantidad de `it` (1 si la dejó vacía). Devuelve la cantidad resultante. */
function absorb(twin,it){twin.quantity=round3((twin.quantity||0)+(it.quantity>0?it.quantity:1));return twin.quantity}
/** Líneas para enviar al servidor: une repetidas (mismo producto+unidad). Falla si el precio manual difiere. */
function payloadItems(items){const out=[];for(const it of items){
  const t=out.find(x=>x.productId&&x.productId===it.productId&&x.unit===it.unit);
  if(!t){out.push({...it});continue}
  if((t.manualPrice??null)!==(it.manualPrice??null))throw Object.assign(new Error(`"${it.name}" está repetido con precios distintos: deja una sola línea`),{code:'LOCAL'});
  t.quantity=round3((t.quantity||0)+(it.quantity||0))}
  return out}
const MAX_QTY=100000,MAX_PRICE=100000000;     // mismos límites que el servidor
/** Cantidad: vacía = aún sin cantidad (se exige al guardar); >0 y <=100000; admite coma decimal; 3 decimales. */
function parseQty(raw){const s=String(raw??'').trim().replace(',','.');
  if(s==='')return{ok:true,value:null};
  const n=Number(s);
  if(!Number.isFinite(n))return{ok:false,value:null,error:'La cantidad debe ser un número'};
  if(n<=0)return{ok:false,value:null,error:'La cantidad debe ser mayor que 0'};
  if(n>MAX_QTY)return{ok:false,value:null,error:'Cantidad demasiado grande (máx. '+MAX_QTY+')'};
  const r=round3(n);
  if(!(r>0))return{ok:false,value:null,error:'Cantidad demasiado pequeña (mín. 0.001)'};
  return{ok:true,value:r}}
/** Precio en pesos: vacío = usar el del catálogo; nunca negativo; sin decimales. */
function parsePrice(raw){const s=String(raw??'').trim().replace(',','.');
  if(s==='')return{ok:true,value:null};
  const n=Number(s);
  if(!Number.isFinite(n))return{ok:false,value:null,error:'El precio debe ser un número'};
  if(n<0)return{ok:false,value:null,error:'El precio no puede ser negativo'};
  if(n>MAX_PRICE)return{ok:false,value:null,error:'Precio demasiado grande'};
  return{ok:true,value:Math.round(n)}}
/** Impide teclear signo, exponente o '+' en campos numéricos (el pegado lo valida parseQty/parsePrice). */
const blockKeys=e=>{if(['-','+','e','E'].includes(e.key))e.preventDefault()};
const setBad=(el,on)=>{on?el.classList.add('bad'):el.classList.remove('bad')};
/* PURE:END */

let loading=false,again=false;
/** Carga el tablero. Si llega otro aviso mientras carga, repite una sola vez (sin peticiones solapadas). */
async function loadOrders(){if(loading){again=true;return}loading=true;
  try{
    let orders=[];
    try{
      orders=await api('/api/orders');
      try{localStorage.setItem('oasis_cached_orders',JSON.stringify(orders))}catch(e){}
    }catch(err){
      if(err.isOffline||isOffline){
        try{orders=JSON.parse(localStorage.getItem('oasis_cached_orders')||'[]')}catch(e){orders=[]}
      }else{throw err}
    }
    const offList=getOfflineOrders().map(off=>({
      id:off.id,
      version:1,
      status:off.andApprove?'COMPLETED':'PENDING_APPROVAL',
      reviewStatus:off.andApprove?'CONFIRMED':'DRAFT',
      conversationStatus:'DONE',
      aiStatus:'NONE',
      printStatus:off.andApprove?'PRINTED':'NOT_PRINTED',
      saleId:null,
      total:off.total||0,
      customer:{name:off.rawPayload.customerName||'Cliente mostrador',type:'RESTAURANTE'},
      address:off.rawPayload.address||'',
      notes:off.rawPayload.notes||'',
      items:(off.rawPayload.items||[]).map((it,idx)=>({
        id:'off-it-'+idx,
        productId:it.productId,
        productName:it.productName||(S.products.find(p=>p.id===it.productId)?.name)||'Producto',
        quantity:it.quantity,
        unit:it.unit||'LB',
        manualPrice:it.manualPrice
      })),
      isOffline:true,
      rawPayload:off.rawPayload,
      andApprove:off.andApprove,
      receivedAt:off.createdAt||new Date().toISOString()
    }));
    S.orders=[...offList,...orders.filter(o=>!offList.some(off=>off.id===o.id))];
    if(S.tab==='ops')renderOps();
  }finally{loading=false;if(again){again=false;loadOrders()}}}
function draftOf(o){return S.draft[o.id]||null}
function buildDraft(o){return S.draft[o.id]||{version:o.version,customerName:o.customer.name||'',address:o.address||'',notes:o.notes||'',deliveryPersonId:o.deliveryPersonId||null,
  items:o.items.map(i=>({id:i.id,name:i.productName||i.mentioned||'',productId:i.productId,quantity:i.quantity,unit:i.unit||'LB',manualPrice:i.manualPrice,reason:i.priceChangeReason}))}}
function priceFor(o,it){const p=S.products.find(x=>x.id===it.productId);if(it.manualPrice!=null)return it.manualPrice;return p?(p.prices[o.customer.type]??null):null}
function totalOf(o,d){return d.items.reduce((s,it)=>{if(it.qtyError||it.priceError)return s;const p=priceFor(o,it);return s+(p!=null&&it.quantity>0?Math.round(it.quantity*p):0)},0)}

function triggerCameraUpload(){
  let fi=document.querySelector('#cameraUploadInput');
  if(!fi){
    fi=h('input',{id:'cameraUploadInput',type:'file',accept:'image/*',capture:'environment',style:'display:none'});
    document.body.append(fi);
    fi.addEventListener('change',async()=>{
      const file=fi.files?.[0];
      if(!file)return;
      const custName=prompt('Nombre del cliente o negocio para esta lista (opcional):','');
      if(custName===null){fi.value='';return}
      const fd=new FormData();
      fd.append('file',file);
      if(custName.trim())fd.append('name',custName.trim());
      toast('Subiendo foto y leyendo lista con IA... ⏳');
      try{
        const res=await fetch('/api/orders/upload-photo',{
          method:'POST',
          headers:{'X-XSRF-TOKEN':csrf()},
          body:fd
        });
        if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.message||'Error al procesar foto')}
        toast('✓ ¡Foto recibida! Extrayendo factura e imprimiendo...');
        fi.value='';
        setTimeout(async()=>{
          await updatePrinterStatus();
          await loadOrders();
        },1200);
      }catch(e){toast('Error: '+e.message);fi.value=''}
    });
  }
  fi.click();
}

  const rowPad = compact ? '1.5px 3px' : '3.5px 3px';
  const descPad = compact ? '1.5px 5px' : '3.5px 6px';

  for(let i=0; i<targetRows; i++){

function makeSwipeable(el, orderId, onValidate){
  let startX=0, startY=0, distX=0, isSwiping=false;
  el.addEventListener('touchstart', e=>{
    if(!e.touches||!e.touches[0])return;
    const touch=e.touches[0];
    startX=touch.clientX;
    startY=touch.clientY;
    distX=0;
    isSwiping=false;
  },{passive:true});

  el.addEventListener('touchmove', e=>{
    if(!e.touches||!e.touches[0])return;
    const touch=e.touches[0];
    distX=touch.clientX-startX;
    const distY=Math.abs(touch.clientY-startY);
    if(distX>25 && distY<45){
      isSwiping=true;
      el.style.transform=`translateX(${Math.min(distX,130)}px)`;
      el.style.opacity=`${Math.max(1-distX/260,0.45)}`;
      el.style.borderLeftColor='#22c55e';
    }
  },{passive:true});

  el.addEventListener('touchend', async()=>{
    if(isSwiping && distX>85){
      el.style.transition='all 0.25s ease-out';
      el.style.transform='translateX(100%)';
      el.style.opacity='0';
      setTimeout(async()=>{
        await onValidate();
      },180);
    } else if(isSwiping){
      el.style.transition='all 0.2s ease-out';
      el.style.transform='';
      el.style.opacity='';
      setTimeout(()=>{el.style.transition=''},200);
    }
  });
}

async function save(o,d){
  // Auto-ajuste de unidades contra catálogo antes de guardar/aprobar
  for(const it of d.items){
    const p=S.products.find(x=>x.id===it.productId);
    if(p&&it.unit&&it.unit!==p.unit){
      if(it.unit==='KG'&&p.unit==='LB'&&it.quantity>0){
        it.quantity=Math.round(it.quantity*2*10)/10;
        toast(`Ajustado: ${p.name} se convirtió de KG a LB (${it.quantity} LB)`);
      }else if(it.unit==='LB'&&p.unit==='KG'&&it.quantity>0){
        it.quantity=Math.round(it.quantity*0.5*10)/10;
        toast(`Ajustado: ${p.name} se convirtió de LB a KG (${it.quantity} KG)`);
      }
      it.unit=p.unit;
    }
  }
  const bad=d.items.find(i=>i.qtyError||i.priceError);
  if(bad)throw Object.assign(new Error('Corrige '+(bad.name||'la línea')+': '+(bad.qtyError||bad.priceError)),{code:'LOCAL'});
  if(d.items.some(i=>!i.productId||!(i.quantity>0)))throw Object.assign(new Error('Completa producto y cantidad de todas las líneas (o elimina la línea vacía)'),{code:'LOCAL'});
  const items=payloadItems(d.items);                      // une repetidas antes de enviar; el servidor también las rechaza
  const body={version:d.version,customerName:d.customerName,address:d.address,notes:d.notes,deliveryPersonId:d.deliveryPersonId||null,items:items.map(i=>({id:i.id,productId:i.productId,quantity:i.quantity,unit:i.unit,manualPrice:i.manualPrice,priceChangeReason:i.reason}))};
  const r=await api(`/api/orders/${o.id}`,{method:'PUT',body});d.version=r.version;return r}
function replyPanel(el,o,kind,text){
  el.querySelector('.reply')?.remove();
  const ta=h('textarea',{rows:4,style:'width:100%;font-size:14px;padding:8px;box-sizing:border-box;border-radius:6px;border:1px solid #444;background:#181818;color:#fff;'});
  ta.value=text;
  const sendBtn=h('button',{class:'b main'},'ENVIAR POR WHATSAPP');
  const cancelBtn=h('button',{class:'b',onclick:()=>el.querySelector('.reply')?.remove()},'Cancelar');
  sendBtn.onclick=async()=>{
    const msg=ta.value.trim();
    if(!msg){toast('Escribe un mensaje antes de enviar');return}
    sendBtn.disabled=true;cancelBtn.disabled=true;ta.disabled=true;
    sendBtn.textContent='Enviando... ⏳';
    try{
      await api(`/api/orders/${o.id}/reply`,{method:'POST',body:{message:msg,kind}});
      toast('✓ Mensaje enviado al cliente por WhatsApp');
      el.querySelector('.reply')?.remove();
      await loadOrders();
    }catch(e){
      sendBtn.disabled=false;cancelBtn.disabled=false;ta.disabled=false;
      sendBtn.textContent='ENVIAR POR WHATSAPP';
      toast((e.details&&e.details.length?e.message+': '+e.details.join('; '):e.message));
    }
  };
  el.append(h('div',{class:'conv reply',style:'margin-top:10px;padding:12px;background:#142217;border:1px solid var(--g);border-radius:8px'},
    h('div',{class:'mut',style:'font-weight:600;margin-bottom:6px'},
      kind==='ASK'?'Pregunta / aclaración al cliente (por WhatsApp):':
      kind==='CONFIRM'?'Confirmación al cliente (el total lo calculó el sistema):':
      'Mensaje directo al cliente (por WhatsApp):'),
    ta,h('div',{class:'row',style:'margin-top:8px'},sendBtn,cancelBtn)));
  ta.focus();
}

    h('span',{class:'sp'}),
    quickSaleBtn,
    h('button',{class:'b',onclick:closeModal},'✕ Cerrar')
  );

  const custSearch = h('input',{placeholder:'🔍 Buscar cliente por nombre o teléfono...',style:'width:100%'});
  const custDropdown = h('div',{style:'display:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-height:160px;overflow-y:auto;padding:4px'});
  
  const custName = h('input',{placeholder:'Nombre del cliente (ej: Don Carlos o dejar para mostrador)',style:'flex:1'});
  const custPhone = h('input',{placeholder:'Teléfono (opcional para venta mostrador)',style:'flex:1'});
  const addrSelect = h('select',{style:'flex:1'}, h('option',{value:''},'-- Seleccionar dirección guardada --'));
  const addrInput = h('input',{placeholder:'Dirección (o dejar vacío para mostrador)',style:'flex:2'});
  const deliveryPersonSelect = h('select',{style:'flex:1'},
    h('option',{value:''},'🛵 Sin repartidor (o mostrador)'),
    ...(S.deliveryPersons||[]).map(dp=>h('option',{value:dp.id},`🛵 ${dp.name}`))
  );
  const notesInput = h('input',{placeholder:'Observaciones (opcional)',style:'flex:2'});
  
  const addrRow = h('div',{class:'row',style:'display:flex;gap:8px;align-items:center'}, addrSelect, addrInput, deliveryPersonSelect);

  const applyQuickSale = () => {
    selectedCustomer = null;
    custName.value = 'Cliente mostrador';
    custPhone.value = '';
    custSearch.value = 'Cliente mostrador (Venta rápida)';
    addrInput.value = 'Mostrador / Local';
    notesInput.value = 'Venta rápida local';
    deliveryPersonSelect.value = '';
    toast('Modo Venta Rápida activado: teléfono y nombre opcionales');
  };
  if(isQuickSale) setTimeout(applyQuickSale, 10);
  
  let searchTimer;
  custSearch.oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      const q = custSearch.value.trim();
      if (!q) { custDropdown.style.display = 'none'; return; }
      try {
        const list = await api('/api/customers?q=' + encodeURIComponent(q));
        if (!list || !list.length) {
          custDropdown.replaceChildren(h('div',{class:'mut',style:'padding:6px'},'No se encontraron clientes. Completa los campos abajo para registrarlo.'));
        } else {
          custDropdown.replaceChildren(...list.map(c => {
            const item = h('div',{style:'padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center',
              onclick: async () => {
                selectedCustomer = c;
                custName.value = c.name || '';
                custPhone.value = c.phone || c.phoneMasked || '';
                custDropdown.style.display = 'none';
                custSearch.value = (c.name || 'Cliente') + ' (' + (c.phone || c.phoneMasked) + ')';
                try {
                  customerAddresses = await api(`/api/customers/${c.id}/addresses`);
                  addrSelect.replaceChildren(
                    h('option',{value:''},'📍 Seleccionar dirección...'),
                    ...customerAddresses.map(a => h('option',{value:a.address,selected:a.isDefault},`${a.label}: ${a.address}`)),
                    h('option',{value:'MOSTRADOR'},'🏢 Entrega en Mostrador / Tienda'),
                    h('option',{value:'NUEVA'},'+ Nueva dirección...')
                  );
                  const def = customerAddresses.find(a => a.isDefault);
                  if (def) addrInput.value = def.address;
                } catch(x){}
                calcTotal();
              }},
              h('b',{},c.name || '(Sin nombre)'),
              h('span',{class:'mut'},(c.phone || c.phoneMasked) + (c.address ? ' · ' + c.address : ''))
            );
            item.onmouseover = () => item.style.background = 'var(--line)';
            item.onmouseout = () => item.style.background = '';
            return item;
          }));
        }
        custDropdown.style.display = 'block';
      } catch(e) {
        custDropdown.style.display = 'none';
      }
    }, 250);
  };

  addrSelect.onchange = () => {
    if (addrSelect.value === 'MOSTRADOR') {
      addrInput.value = 'Mostrador / Para llevar';
    } else if (addrSelect.value === 'NUEVA') {
      addrInput.value = '';
      addrInput.focus();
    } else if (addrSelect.value) {
      addrInput.value = addrSelect.value;
    }
  };

  const items = [];
  const tb = h('tbody');
  const totalEl = h('b',{class:'total'},cop(0));

  const calcTotal = () => {
    const custType = selectedCustomer?.customerType || 'RETAIL';
    let sum = 0;
    for (const it of items) {
      if (!it.productId || !(it.quantity > 0)) continue;
      const p = S.products.find(x => x.id === it.productId);
      const pr = it.manualPrice != null ? it.manualPrice : (p?.prices[custType] ?? 0);
      sum += Math.round(it.quantity * pr);
    }
    totalEl.textContent = cop(sum);
  };

  const addItemRow = (initialName = '', initialQty = null) => {
    const it = { productId: null, name: initialName, quantity: initialQty, unit: 'LB', manualPrice: null };
    items.push(it);
    
    const sub = h('td',{class:'sub'},'—');
    const qInput = h('input',{class:'q',type:'number',step:'0.5',min:'0',max:MAX_QTY,value:it.quantity??'',onkeydown:blockKeys,
      oninput: e => {
        const r = parseQty(e.target.value);
        it.quantity = r.value;
        const p = S.products.find(x => x.id === it.productId);
        const pr = it.manualPrice != null ? it.manualPrice : (p?.prices[selectedCustomer?.customerType||'RETAIL'] ?? 0);
        sub.textContent = r.ok && it.quantity > 0 && pr != null ? cop(it.quantity * pr) : '—';
        calcTotal();
      }});
    const unitSelect = h('select',{onchange: e => { it.unit = e.target.value; }}, ['LB','KG','UNIDAD'].map(u=>h('option',{value:u,selected:u===it.unit},u==='UNIDAD'?'UN':u)));
    const prInput = h('input',{class:'pr',type:'number',min:'0',placeholder:'Catálogo',onkeydown:blockKeys,
      oninput: e => {
        const r = parsePrice(e.target.value);
        it.manualPrice = r.value;
        const p = S.products.find(x => x.id === it.productId);
        const pr = it.manualPrice != null ? it.manualPrice : (p?.prices[selectedCustomer?.customerType||'RETAIL'] ?? 0);
        sub.textContent = it.quantity > 0 && pr != null ? cop(it.quantity * pr) : '—';
        calcTotal();
      }});
    const nameInput = h('input',{class:'pn',list:'dl',placeholder:'Escribe producto...',value:it.name,
      onchange: e => {
        const p = byName(e.target.value);
        if (!p) { it.productId = null; toast('Producto no encontrado'); return; }
        it.productId = p.id;
        it.name = p.name;
        it.unit = p.unit;
        unitSelect.value = p.unit;
        prInput.placeholder = p.prices[selectedCustomer?.customerType||'RETAIL'] ?? '';
        const pr = it.manualPrice != null ? it.manualPrice : (p.prices[selectedCustomer?.customerType||'RETAIL'] ?? 0);
        sub.textContent = it.quantity > 0 ? cop(it.quantity * pr) : '—';
        calcTotal();
      }});

    const delBtn = h('button',{class:'b danger',onclick:()=>{
      const idx = items.indexOf(it);
      if (idx >= 0) items.splice(idx, 1);
      tr.remove();
      calcTotal();
    }},'✕');

    const tr = h('tr',{}, h('td',{},nameInput), h('td',{},qInput), h('td',{},unitSelect), h('td',{},prInput), sub, h('td',{},delBtn));
    tb.append(tr);
    nameInput.focus();
  };

  addItemRow();

  const addRowBtn = h('button',{class:'b',onclick:()=>addItemRow()},'+ Agregar Producto');

  const createOrder = async (andApprove = false) => {
    const validItems = items.filter(i => i.productId && i.quantity > 0);
    if (!validItems.length) {
      toast('Agrega al menos un producto con cantidad válida');
      return;
    }
    const cPhone = custPhone.value.trim();
    const dpId = deliveryPersonSelect.value ? Number(deliveryPersonSelect.value) : null;

    const payload = {
      customerId: selectedCustomer?.id || null,
      customerName: custName.value.trim() || 'Cliente mostrador',
      customerPhone: cPhone || null,
      address: addrInput.value.trim() || 'Mostrador / Local',
      notes: notesInput.value.trim() || null,
      deliveryPersonId: dpId,
      items: validItems.map(i => ({
        productId: i.productId,
        quantity: i.quantity,
        unit: i.unit,
        manualPrice: i.manualPrice,
        priceChangeReason: i.manualPrice != null ? 'Precio manual en mostrador' : null
      }))
    };

    try {
      if (isOffline) {
        throw Object.assign(new Error('OFFLINE'), { isOffline: true });
      }
      const order = await api('/api/orders/manual', { method: 'POST', body: payload });
      toast(`✓ Pedido manual #${order.id} creado`);
      closeModal();
      await loadOrders();

      if (andApprove) {
        try {
          const res = await api(`/api/orders/${order.id}/approve`, { method: 'POST', body: { version: order.version, deliveryPersonId: dpId } });
          toast(`✓ Venta #${res.saleId} (${cop(res.total)}) aprobada e impresa`);
          await loadOrders();
          showTicket(res.saleId);
        } catch(e) {
          toast('Pedido creado pero falló al aprobar: ' + e.message);
        }
      }
    } catch(e) {
      if (e.isOffline || isOffline) {
        const localId = 'LOCAL-' + Date.now().toString().slice(-4);
        const estTotal = validItems.reduce((acc, it) => {
          const p = S.products.find(x => x.id === it.productId);
          const pr = it.manualPrice != null ? it.manualPrice : (p ? (p.prices['RESTAURANTE'] || 0) : 0);
          return acc + (it.quantity * pr);
        }, 0);
        saveOfflineOrder({
          id: localId,
          rawPayload: payload,
          andApprove: andApprove,
          total: estTotal,
          createdAt: new Date().toISOString()
        });
        toast(`⚡ Guardado localmente (#${localId}). Se sincronizará automáticamente al volver internet.`);
        closeModal();
        await loadOrders();
      } else {
        toast(e.message);
      }
    }
  };

  const createBtn = h('button',{class:'b',onclick:()=>createOrder(false)},'Crear Pedido');
  const createAndApproveBtn = h('button',{class:'b main',onclick:()=>createOrder(true)},'⚡ Cobrar e Imprimir');

  modal.append(
    title,
    h('div',{style:'display:flex;flex-direction:column;gap:6px'},
      custSearch, custDropdown,
      h('div',{class:'row'}, custName, custPhone),
      addrRow,
      notesInput
    ),
    h('div',{class:'scroll',style:'max-height:280px;overflow-y:auto'},
      h('table',{}, h('thead',{},h('tr',{},['Producto','Cantidad','Unidad','Precio','Subtotal',''].map(t=>h('th',{},t)))), tb)
    ),
    h('div',{class:'row',style:'justify-content:space-between;margin-top:8px'},
      addRowBtn,
      h('div',{class:'row',style:'gap:12px;align-items:center'},
        h('span',{},'Total estimado: '), totalEl,
        createBtn, createAndApproveBtn
      )
    )
  );

  overlay.append(modal);
  document.body.append(overlay);
}

function openAddressModal(c) {
  const overlay = h('div',{class:'modal-overlay',onclick:e=>{if(e.target===overlay)closeModal()}});
  const modal = h('div',{class:'modal-card',style:'max-width:650px'});
  const closeModal = () => overlay.remove();
  const listEl = h('tbody');

  const load = async () => {
    try {
      const addrs = await api(`/api/customers/${c.id}/addresses`);
      if (!addrs || !addrs.length) {
        listEl.replaceChildren(h('tr',{},h('td',{colspan:4,class:'mut'},'No hay direcciones guardadas aún.')));
      } else {
        listEl.replaceChildren(...addrs.map(a => h('tr',{},
          h('td',{},h('span',{class:'pill gray'},a.label)),
          h('td',{},a.address),
          h('td',{},a.isDefault ? h('span',{class:'pill GREEN'},'⭐ Principal') : ''),
          h('td',{},h('button',{class:'b danger',style:'padding:3px 8px;font-size:12px',onclick:async()=>{
            if(confirm(`¿Eliminar dirección "${a.label}: ${a.address}"?`)){
              try{await api(`/api/customers/addresses/${a.id}`,{method:'DELETE'});toast('Dirección eliminada');load();}catch(e){toast(e.message)}
            }
          }},'🗑'))
        )));
      }
    } catch(e) { toast(e.message); }
  };

  const labelSel = h('select',{},['Casa','Apartamento','Negocio','Oficina','Finca','Otro'].map(l=>h('option',{value:l},l)));
  const addrInput = h('input',{placeholder:'Dirección (ej: Calle 10 # 5-20 Apt 301)',style:'flex:2'});
  const defCheck = h('input',{type:'checkbox'});
  const addBtn = h('button',{class:'b main',style:'padding:6px 12px',onclick:async()=>{
    const addr = addrInput.value.trim();
    if(!addr){toast('Ingresa la dirección');return;}
    try{
      await api(`/api/customers/${c.id}/addresses`,{method:'POST',body:{label:labelSel.value,address:addr,isDefault:defCheck.checked}});
      toast('✓ Dirección agregada');
      addrInput.value='';
      defCheck.checked=false;
      load();
    }catch(e){toast(e.message)}
  }},'+ Agregar');

  modal.replaceChildren(
    h('div',{class:'top'},h('b',{style:'font-size:16px'},`📍 Direcciones de ${c.name || 'Cliente'}`),h('span',{class:'sp'}),h('button',{class:'b',onclick:closeModal},'✕ Cerrar')),
    h('div',{class:'scroll',style:'margin:12px 0'},h('table',{},h('thead',{},h('tr',{},['Etiqueta','Dirección','Estado',''].map(t=>h('th',{},t)))),listEl)),
    h('h4',{style:'margin:10px 0 6px'},'Agregar nueva dirección:'),
    h('div',{class:'row',style:'gap:8px;align-items:center'},labelSel,addrInput,h('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px'},defCheck,'Principal'),addBtn)
  );

  overlay.append(modal);
  document.body.append(overlay);
  load();
}

function openNewCustomerModal(onDone) {
  const overlay = h('div',{class:'modal-overlay',onclick:e=>{if(e.target===overlay)closeModal()}});
  const modal = h('div',{class:'modal-card',style:'max-width:550px'});
  const closeModal = () => overlay.remove();
  const nameInput = h('input',{placeholder:'Nombre completo (ej: Don Carlos Gómez)',style:'width:100%'});
  const phoneInput = h('input',{placeholder:'Teléfono WhatsApp (ej: 573101234567)',style:'width:100%'});
  const labelSel = h('select',{},['Casa','Apartamento','Negocio','Oficina','Tienda'].map(l=>h('option',{value:l},l)));
  const addrInput = h('input',{placeholder:'Dirección inicial (opcional)',style:'flex:1'});
  const typeSel = h('select',{},[h('option',{value:'RETAIL'},'Minorista'),h('option',{value:'WHOLESALE'},'Mayorista')]);

  const saveBtn = h('button',{class:'b main',onclick:async()=>{
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    if(!name){toast('El nombre es requerido');nameInput.focus();return;}
    if(!phone){toast('El teléfono es requerido');phoneInput.focus();return;}
    try{
      await api('/api/customers',{method:'POST',body:{
        name,
        phone,
        address:addrInput.value.trim()||null,
        addressLabel:labelSel.value,
        customerType:typeSel.value
      }});
      toast('✓ Cliente creado con éxito');
      closeModal();
      if(onDone) onDone();
    }catch(e){toast(e.message)}

  modal.replaceChildren(
    h('div',{class:'top'},h('b',{style:'font-size:16px'},'➕ Registrar Nuevo Cliente'),h('span',{class:'sp'}),h('button',{class:'b',onclick:closeModal},'✕ Cerrar')),
    h('div',{style:'display:flex;flex-direction:column;gap:10px;margin-top:12px'},
      h('label',{},'Nombre: ',nameInput),
      h('label',{},'Teléfono: ',phoneInput),
      h('div',{class:'row'},h('label',{},'Etiqueta: ',labelSel),h('label',{style:'flex:1'},'Dirección: ',addrInput)),
      S.me.role==='ADMIN'?h('label',{},'Tipo de precio: ',typeSel):null,
      h('div',{class:'row',style:'justify-content:flex-end;margin-top:10px'},
        h('button',{class:'b',onclick:closeModal},'Cancelar'),
        saveBtn
      )
    )
  );

  overlay.append(modal);
  document.body.append(overlay);
}

/* ---------- Configuración de Impresoras ---------- */
async function renderPrinterConfig(){
  const m=$('#main');
  m.replaceChildren(h('div',{class:'card',style:'text-align:center;padding:24px'},'Cargando configuración de impresoras... ⏳'));
  try{
    const cfg = await api('/api/printer/config');
    const locName = cfg.activePrinter==='OFICINA'?'🏪 FRUVER (4am-7pm)':'🏠 CASA (7pm-4am)';

    const officeHostInput = h('input',{value:cfg.officeHost||'127.0.0.1',placeholder:'IP Impresora Fruver',style:'font-size:15px;font-weight:700;width:100%'});
    const officePortInput = h('input',{type:'number',value:cfg.officePort||631,placeholder:'Puerto (631 IPP / 9100 RAW)',style:'font-size:15px;font-weight:700;width:130px'});

    const homeHostInput = h('input',{value:cfg.homeHost||'127.0.0.1',placeholder:'IP Impresora Casa',style:'font-size:15px;font-weight:700;width:100%'});
    const homePortInput = h('input',{type:'number',value:cfg.homePort||631,placeholder:'Puerto',style:'font-size:15px;font-weight:700;width:100px'});

    const modeSelect = h('select',{style:'font-size:15px;padding:9px;font-weight:700;width:100%'},
      h('option',{value:'AUTO',selected:cfg.mode==='AUTO'},'⏱️ Horario Automático (Fruver 4am-7pm / Casa 7pm-4am)'),
      h('option',{value:'OFICINA',selected:cfg.mode==='OFICINA'},'🏪 Forzar SIEMPRE Fruver'),
      h('option',{value:'CASA',selected:cfg.mode==='CASA'},'🏠 Forzar SIEMPRE Casa')
    );

    const enabledChk = h('input',{type:'checkbox',checked:cfg.enabled,style:'width:22px;height:22px;cursor:pointer'});

    const aiDebounceInput = h('input',{
      type:'number',
      min:0,
      max:120,
      value:cfg.customerDebounceSeconds != null ? cfg.customerDebounceSeconds : 20,
      placeholder:'Ej: 20',
      style:'font-size:15px;font-weight:700;width:90px;text-align:center'
    });

    const graceMinutes = Math.round((cfg.orderGraceSeconds != null ? cfg.orderGraceSeconds : 300) / 60);
    const orderGraceInput = h('input',{
      type:'number',
      min:0,
      max:120,
      value:graceMinutes,
      placeholder:'Ej: 5',
      style:'font-size:15px;font-weight:700;width:90px;text-align:center'
    });

    const printTimeoutInput = h('input',{
      type:'number',
      min:1,
      max:60,
      value:cfg.printTimeoutSeconds != null ? cfg.printTimeoutSeconds : 5,
      placeholder:'Ej: 5',
      style:'font-size:15px;font-weight:700;width:90px;text-align:center'
    });

    const autoPrintChk = h('input',{
      type:'checkbox',
      checked:cfg.autoPrintWholesale !== false,
      style:'width:22px;height:22px;cursor:pointer'
    });

    const saveBtn = h('button',{class:'b main',style:'font-size:16px;padding:12px 24px;font-weight:800;background:var(--g);border-color:var(--g)',onclick:async()=>{
      saveBtn.disabled = true;
      try{
        const graceM = Number(orderGraceInput.value);
        const timeoutS = Number(printTimeoutInput.value);
        const debounceS = Number(aiDebounceInput.value);
        await api('/api/printer/config',{
          method:'PUT',
          body:{
            officeHost: officeHostInput.value.trim(),
            officePort: Number(officePortInput.value)||9100,
            homeHost: homeHostInput.value.trim(),
            homePort: Number(homePortInput.value)||9100,
            enabled: enabledChk.checked,
            mode: modeSelect.value,
            orderGraceSeconds: isNaN(graceM) || graceM < 0 ? 300 : Math.round(graceM * 60),
            printTimeoutSeconds: isNaN(timeoutS) || timeoutS < 1 ? 5 : Math.round(timeoutS),
            autoPrintWholesale: autoPrintChk.checked,
            customerDebounceSeconds: isNaN(debounceS) || debounceS < 0 ? 20 : Math.round(debounceS)
          }
        });
        toast('✓ Configuración y tiempos de espera guardados correctamente');
        await updatePrinterStatus();
        renderPrinterConfig();
      }catch(e){toast('Error al guardar: '+e.message)}
      finally{saveBtn.disabled=false}
    }},'💾 GUARDAR CONFIGURACIÓN');

    const testOfficeBtn = h('button',{class:'b',style:'font-size:13.5px;padding:8px 14px;font-weight:700;background:#1e3a5f;color:#93c5fd',onclick:async()=>{
      testOfficeBtn.disabled=true;
      toast('Enviando página de prueba a Fruver... ⏳');
      try{
        const r=await api('/api/printer/test',{method:'POST',body:{location:'OFICINA'}});
        toast('✓ '+r.message);
      }catch(e){toast('🔴 Error Fruver: '+e.message)}
      finally{testOfficeBtn.disabled=false}
    }},'🖨️ Probar Fruver');

    const testHomeBtn = h('button',{class:'b',style:'font-size:13.5px;padding:8px 14px;font-weight:700;background:#1e3a5f;color:#93c5fd',onclick:async()=>{
      testHomeBtn.disabled=true;
      toast('Enviando ticket de prueba a Casa... ⏳');
      try{
        const r=await api('/api/printer/test',{method:'POST',body:{location:'CASA'}});
        toast('✓ '+r.message);
      }catch(e){toast('🔴 Error Casa: '+e.message)}
      finally{testHomeBtn.disabled=false}
    }},'🖨️ Probar Casa');

    const card = h('div',{class:'card',style:'max-width:640px;margin:12px auto;padding:18px'},
      h('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px'},
        h('b',{style:'font-size:18px'},'🖨️ Configuración de Impresoras'),
        h('span',{class:'pill '+(cfg.failedCount>0?'RED':'GREEN'),style:'font-size:13px;font-weight:700'},
          `Activa: ${locName}`
        )
      ),
      h('div',{class:'banner',style:'background:#1e293b;border-left:4px solid var(--g);margin-bottom:16px;font-size:13px'},
        'Configura las IP locales de las impresoras térmicas ESC/POS (puerto RAW 9100). El sistema enruta pedidos automáticamente entre la Oficina y la Casa.'
      ),
      h('div',{style:'display:flex;flex-direction:column;gap:14px'},
        h('div',{style:'background:rgba(255,255,255,0.03);padding:14px;border-radius:8px;border:1px solid var(--line)'},
          h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'},
            h('b',{style:'font-size:15px;color:#93c5fd'},'🏢 Impresora Oficina / Fruver (04:00 - 19:00)'),
            testOfficeBtn
          ),
          h('div',{style:'display:flex;gap:10px'},
            h('div',{style:'flex:1'},h('span',{class:'mut',style:'font-size:12px'},'IP / Host LAN'),officeHostInput),
            h('div',{},h('span',{class:'mut',style:'font-size:12px'},'Puerto'),officePortInput)
          )
        ),
        h('div',{style:'background:rgba(255,255,255,0.03);padding:14px;border-radius:8px;border:1px solid var(--line)'},
          h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'},

/* ---------- Repartidores (ADMIN) ---------- */
async function renderDeliveryPersons(){
  const m=$('#main');
  const tbody=h('tbody');
  const rankingBody=h('tbody');

  const load=async()=>{
    try{
      S.deliveryPersons=await api('/api/delivery-persons?includeInactive=true');
      tbody.replaceChildren(...S.deliveryPersons.map(dp=>{
        const nameInput=h('input',{value:dp.name,style:'width:220px'});
        const phoneInput=h('input',{value:dp.phone||'',style:'width:150px'});
        const activeCheck=h('input',{type:'checkbox',checked:dp.active});

        const saveBtn=h('button',{class:'b',onclick:async()=>{
          const nm=nameInput.value.trim();
          if(!nm){toast('El nombre es requerido');return}
          try{
            await api(`/api/delivery-persons/${dp.id}`,{
              method:'PUT',
              body:{name:nm,phone:phoneInput.value.trim()||null,active:activeCheck.checked}
            });
            toast('✓ Repartidor guardado');
            await load();
          }catch(e){toast(e.message)}
        }},'Guardar');

        const delBtn=h('button',{class:'b',style:'color:var(--r)',onclick:async()=>{
          if(!confirm(`¿Eliminar al repartidor "${dp.name}"?`))return;
          try{
            await api(`/api/delivery-persons/${dp.id}`,{method:'DELETE'});
            toast('✓ Repartidor eliminado');
            await load();
          }catch(e){toast(e.message)}
        }},'✕');

        return h('tr',{},
          h('td',{},nameInput),
          h('td',{},phoneInput),
          h('td',{style:'text-align:center'},activeCheck),
          h('td',{class:'row',style:'gap:6px'},saveBtn,delBtn)
        );
      }));

      // Cargar ranking:
      try{
        const rk=await api('/api/reports/delivery-ranking');
        rankingBody.replaceChildren(...(rk.items||[]).map(r=>h('tr',{},
          h('td',{},h('b',{},'🛵 '+r.deliveryPersonName)),
          h('td',{},h('span',{},r.dailyDeliveries+' pedidos'),h('span',{class:'mut',style:'margin-left:6px'},cop(r.dailyAmount))),
          h('td',{},h('span',{},r.weeklyDeliveries+' pedidos'),h('span',{class:'mut',style:'margin-left:6px'},cop(r.weeklyAmount))),
          h('td',{},h('span',{},r.monthlyDeliveries+' pedidos'),h('span',{class:'mut',style:'margin-left:6px'},cop(r.monthlyAmount))),
          h('td',{},h('b',{},r.totalDeliveries+' pedidos'),h('span',{class:'mut',style:'margin-left:6px'},cop(r.totalAmount)))
        )));
      }catch(x){}
    }catch(e){toast(e.message)}
  };

  const newBtn=h('button',{class:'b main',onclick:()=>{
    const nameInput=h('input',{placeholder:'Nombre (ej: Carlos Gómez - Moto 1)',style:'width:220px'});
    const phoneInput=h('input',{placeholder:'Teléfono WhatsApp',style:'width:150px'});
    const saveNewBtn=h('button',{class:'b main',onclick:async()=>{
      const nm=nameInput.value.trim();
      if(!nm){toast('Ingresa el nombre del repartidor');return}
      try{
        await api('/api/delivery-persons',{
          method:'POST',
          body:{name:nm,phone:phoneInput.value.trim()||null,active:true}
        });
        toast('✓ Repartidor creado');
        await load();
      }catch(e){toast(e.message)}
    }},'Crear');

    tbody.prepend(h('tr',{style:'background:rgba(34,197,94,0.1)'},
      h('td',{},nameInput),
      h('td',{},phoneInput),
      h('td',{style:'text-align:center'},'Activo'),
      h('td',{},saveNewBtn)
    ));
    nameInput.focus();
  }},'➕ Nuevo Repartidor');

  m.replaceChildren(
    h('div',{class:'row',style:'justify-content:space-between;margin-bottom:12px;align-items:center'},
      h('div',{},
        h('h3',{style:'margin:0'},'Gestión de Repartidores / Domiciliarios'),
        h('span',{class:'mut'},'Asigna repartidores a los pedidos antes de imprimirlos para que su nombre salga en la factura.')
      ),
      newBtn
    ),
    h('div',{class:'scroll'},
      h('table',{},
        h('thead',{},h('tr',{},['Nombre / Vehículo','Teléfono','¿Activo?','Acciones'].map(t=>h('th',{},t)))),
        tbody
      )
    ),
    h('h3',{style:'margin-top:24px'},'🏆 Ranking de Repartidores (Entregas y Facturación)'),
    h('p',{class:'mut'},'Métricas consolidadas de cuánto reparte cada domiciliario al día, semana y mes.'),
    h('div',{class:'scroll'},
      h('table',{},
        h('thead',{},h('tr',{},['Repartidor','Hoy','Esta Semana','Este Mes','Total General'].map(t=>h('th',{},t)))),
        rankingBody
      )
    )
  );
  load();
}

/* ---------- Usuarios del Sistema (ADMIN) ---------- */
async function renderUsers(){
  const m=$('#main');
  const tbody=h('tbody');

  const load=async()=>{
    try{
      const users=await api('/api/users');
      tbody.replaceChildren(...users.map(u=>{
        const isSelf=S.me.username.toLowerCase()===u.username.toLowerCase();
        const rolePill=h('span',{class:'pill '+(u.role==='ADMIN'?'GREEN':'gray')},u.role);
        const statusBtn=h('button',{class:'b',disabled:isSelf,onclick:async()=>{
          try{
            await api(`/api/users/${encodeURIComponent(u.username)}/enabled`,{method:'PUT',body:{enabled:!u.enabled}});
            toast(`✓ Usuario ${u.enabled?'desactivado':'activado'}`);
            await load();
          }catch(e){toast(e.message)}
        }},u.enabled?'🟢 Activo':'🔴 Inactivo');

        const passBtn=h('button',{class:'b',title:'Cambiar contraseña',onclick:async()=>{
          const p=prompt(`Nueva contraseña para ${u.username} (mínimo 6 caracteres):`);
          if(p!==null){
            if(p.trim().length<6){toast('La contraseña debe tener al menos 6 caracteres');return}
            try{
              await api(`/api/users/${encodeURIComponent(u.username)}/password`,{method:'PUT',body:{password:p.trim()}});
              toast(`✓ Contraseña actualizada para ${u.username}`);
            }catch(e){toast(e.message)}
          }
        }},'🔑 Contraseña');

        const delBtn=h('button',{class:'b',disabled:isSelf,style:'color:var(--r)',onclick:async()=>{
          if(!confirm(`¿Eliminar al usuario "${u.username}"?`))return;
          try{
            await api(`/api/users/${encodeURIComponent(u.username)}`,{method:'DELETE'});
            toast('✓ Usuario eliminado');
            await load();
          }catch(e){toast(e.message)}
        }},'✕');

        return h('tr',{},
          h('td',{},h('b',{},u.username),isSelf?h('span',{class:'pill gray',style:'margin-left:6px'},'Tú'):null),
          h('td',{},rolePill),
          h('td',{},statusBtn),
          h('td',{},u.createdAt?new Date(u.createdAt).toLocaleDateString('es-CO'):'—'),
          h('td',{class:'row',style:'gap:6px'},passBtn,delBtn)
        );
      }));
    }catch(e){toast(e.message)}
  };

  const newBtn=h('button',{class:'b main',onclick:()=>{
    const userInput=h('input',{placeholder:'Nombre de usuario (ej: vendedor1)',style:'width:180px'});
    const passInput=h('input',{type:'password',placeholder:'Contraseña (mín 6 car.)',style:'width:170px'});
    const roleSel=h('select',{},h('option',{value:'OPERADOR'},'Operador / Vendedor'),h('option',{value:'ADMIN'},'Administrador'));

    const saveNewBtn=h('button',{class:'b main',onclick:async()=>{
      const un=userInput.value.trim();
      const pw=passInput.value.trim();
      if(!un||un.length<3){toast('El usuario debe tener al menos 3 caracteres');return}
      if(!pw||pw.length<6){toast('La contraseña debe tener al menos 6 caracteres');return}
      try{
        await api('/api/users',{
          method:'POST',
          body:{username:un,password:pw,role:roleSel.value}
        });
        toast(`✓ Usuario "${un}" creado exitosamente`);
        await load();
      }catch(e){toast(e.message)}
    }},'Crear');

    tbody.prepend(h('tr',{style:'background:rgba(34,197,94,0.1)'},
      h('td',{},userInput),
      h('td',{},roleSel),
      h('td',{},passInput),
      h('td',{},'Hoy'),
      h('td',{},saveNewBtn)
    ));
    userInput.focus();
  }},'➕ Nuevo Usuario');

  m.replaceChildren(
    h('div',{class:'row',style:'justify-content:space-between;margin-bottom:12px;align-items:center'},
      h('div',{},
        h('h3',{style:'margin:0'},'Usuarios del Sistema'),
        h('span',{class:'mut'},'Crea y administra los usuarios con acceso al aplicativo (Administradores y Operadores).')
      ),
      newBtn
    ),
    h('div',{class:'scroll'},
      h('table',{},
        h('thead',{},h('tr',{},['Usuario','Rol','Estado','Fecha Registro','Acciones'].map(t=>h('th',{},t)))),
        tbody
      )
    )
  );
  load();
}

/* ---------- Arranque & PWA ---------- */
let deferredPrompt = null;
const isStandalone = () => (typeof window !== 'undefined' && typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches) || (typeof window !== 'undefined' && window.navigator && window.navigator.standalone === true);

function showPwaHelpModal(){
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const overlay = h('div',{class:'modal-overlay',onclick:e=>{if(e.target===overlay)overlay.remove()}});
  const modal = h('div',{class:'modal-card',style:'max-width:480px;padding:20px;border-radius:14px;background:var(--card)'},
    h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'},
      h('b',{style:'font-size:17px;color:var(--ink)'},'📲 Cómo Instalar la App en tu Celular'),
      h('button',{class:'b',style:'padding:4px 10px',onclick:()=>overlay.remove()},'✕')
    ),
    h('div',{style:'font-size:14px;line-height:1.5;color:var(--ink)'},
      isIos ? [
        h('p',{style:'font-weight:700;margin-bottom:8px'},'En iPhone / iPad (Safari):'),
        h('ol',{style:'padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:8px'},
          h('li',{},'Toca el botón ',h('b',{},'Compartir (📤)'),' en la barra inferior de Safari.'),
          h('li',{},'Desliza hacia abajo y selecciona ',h('b',{},'➕ Agregar a pantalla de inicio'),'.'),
          h('li',{},'Toca ',h('b',{},'Agregar'),' en la esquina superior derecha.')
        )
      ] : [
        h('p',{style:'font-weight:700;margin-bottom:8px'},'En Android / Google Chrome:'),
        h('ol',{style:'padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:8px'},
          h('li',{},'Toca el menú de ',h('b',{},'tres puntos (⋮)'),' arriba a la derecha en Chrome.'),
          h('li',{},'Toca ',h('b',{},'📲 Instalar aplicación'),' o ',h('b',{},'Agregar a la pantalla principal'),'.'),
          h('li',{},'Confirma la instalación y se agregará el ícono en tu pantalla de inicio.')
        )
      ],
      h('div',{class:'banner',style:'background:#1e293b;border-left:4px solid var(--g);margin-top:14px;font-size:12.5px;color:#94a3b8'},
        '💡 Si eliminaste la app antes, Google Chrome pausa el aviso automático por unas horas, pero el menú (⋮) de Chrome te permite reinstalarla siempre que quieras.'
      )
    ),
    h('div',{style:'display:flex;justify-content:flex-end;margin-top:16px'},
      h('button',{class:'b main',style:'padding:9px 20px',onclick:()=>overlay.remove()},'Entendido')
    )
  );
  overlay.append(modal);
  document.body.append(overlay);
}

async function installPwaOrShowHelp(){
  if(deferredPrompt){
    try{
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if(choice && choice.outcome === 'accepted'){
        toast('✓ Instalando App Fruver El Oasis...');
        $('#installBanner') && ($('#installBanner').style.display='none');
        $('#btnHeaderInstall') && ($('#btnHeaderInstall').style.display='none');
      }
    }catch(e){console.warn('PWA prompt error:',e)}
    deferredPrompt=null;
  }else{
    showPwaHelpModal();
  }
}

async function doLogout(){
  if(confirm('¿Seguro que deseas salir y cerrar la sesión?')){
    try{
      await fetch('/logout',{method:'POST',headers:{'X-XSRF-TOKEN':csrf()}});
    }catch(e){}
    location='/login.html';
  }
}

if(typeof navigator!=='undefined'&&'serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW:',e));
  });
}
if(typeof window!=='undefined'){
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    const banner=$('#installBanner');
    if(banner && !sessionStorage.getItem('dismiss_install')) banner.style.display='flex';
    const headerBtn=$('#btnHeaderInstall');
    if(headerBtn) headerBtn.style.display='inline-flex';
  });
  window.addEventListener('appinstalled',()=>{
    const banner=$('#installBanner');
    if(banner)banner.style.display='none';
    const headerBtn=$('#btnHeaderInstall');
    if(headerBtn)headerBtn.style.display='none';
    toast('✅ ¡App Fruver El Oasis instalada en tu celular!');
  });
}

// Botones de instalación
const btnInst = $('#btnInstall');
if(btnInst) btnInst.onclick = installPwaOrShowHelp;
const btnHdrInst = $('#btnHeaderInstall');
if(btnHdrInst) btnHdrInst.onclick = installPwaOrShowHelp;
const closeBtn = $('#btnInstallClose');
if(closeBtn) closeBtn.onclick = () => {
  sessionStorage.setItem('dismiss_install', '1');
  const banner = $('#installBanner');
  if(banner) banner.style.display = 'none';
};
if(!isStandalone()){
  const hb = $('#btnHeaderInstall');
  if(hb) hb.style.display = 'inline-flex';
}

/* Detecta mobile (<=640) para activar bottom nav */
const isMobile=()=>window.innerWidth<=640;
function applyNavLayout(){
  if(isMobile()){document.body.classList.add('mobile-nav')}
  else{document.body.classList.remove('mobile-nav')}
}
window.addEventListener('resize',applyNavLayout);

function fillDl(){$('#dl').replaceChildren(...S.products.filter(p=>p.active).map(p=>h('option',{value:p.name})))}

/* Iconos y etiquetas para el bottom nav mobile */
const TAB_ICONS={ops:['📋','Pedidos'],sales:['🧾','Ventas'],config:['⚙️','Ajustes'],customers:['👥','Clientes'],'delivery-persons':['🚴','Repartos'],users:['👤','Usuarios'],prices:['💲','Precios'],zones:['📍','Zonas'],reports:['📊','Reportes']};
const DISABLED_TABS=new Set(['customers','users','prices']);

function nav(){
  const tabs=[['ops','Operación'],['sales','Ventas'],['config','Ajustes'],['customers','Clientes']];
  if(S.me.role==='ADMIN')tabs.push(['delivery-persons','Repartidores'],['users','Usuarios'],['prices','Precios'],['zones','Zonas Domicilio'],['reports','Reportes']);
  // Desktop nav (tabs horizontales)
  $('#desktopNav').replaceChildren(...tabs.map(([k,l])=>{
    const disabled=DISABLED_TABS.has(k);
    return h('button',{
      class:S.tab===k?'on':'',
      style:disabled?'opacity:0.42;cursor:not-allowed;filter:grayscale(0.85);':'',
      title:disabled?'Módulo temporalmente desactivado':'',
      onclick:()=>{
        if(disabled){toast('Módulo temporalmente desactivado');return}
        S.tab=k;nav();show();
      }
    },l);
  }));
  // Mobile bottom nav
  const mobileCore=[['ops','Pedidos'],['sales','Ventas'],['config','Ajustes'],['customers','Clientes']];
  const mobileAdmin=[['users','Usuarios'],['prices','Precios']];
  const mobileTabs=S.me.role==='ADMIN'?[...mobileCore,...mobileAdmin]:mobileCore;
  $('#bnav').replaceChildren(...mobileTabs.map(([k])=>{
    const [ico,lbl]=TAB_ICONS[k]||['⚙️',k];
    const disabled=DISABLED_TABS.has(k);
    return h('button',{
      class:S.tab===k?'on':'',
      style:disabled?'opacity:0.42;cursor:not-allowed;filter:grayscale(0.85);':'',
      title:disabled?'Módulo temporalmente desactivado':'',
      onclick:()=>{
        if(disabled){toast('Módulo temporalmente desactivado');return}
        S.tab=k;nav();show();
      }
    },h('span',{class:'ico'},ico),lbl);
  }));
  // Ajustar columnas del grid según cantidad de tabs mobile
  const n=mobileTabs.length;
  $('#bnav').style.gridTemplateColumns=`repeat(${n},1fr)`;
}
function show(){({ops:()=>{renderOps()},sales:renderSales,config:renderPrinterConfig,'delivery-persons':renderDeliveryPersons,users:renderUsers,prices:renderPrices,customers:renderCustomers,zones:renderDeliveryZones,reports:renderReports})[S.tab]?.()}
$('#logoutBtn').onclick=doLogout;
(async()=>{
  if(typeof window !== 'undefined'){
    window.addEventListener('online', ()=>{
      setOfflineState(false);
      toast('🟢 Conexión restablecida. Sincronizando datos...');
      syncOfflineOrders();
      loadOrders();
    });
    window.addEventListener('offline', ()=>{
      setOfflineState(true);
      toast('⚡ Sin conexión a internet. Los pedidos se guardarán localmente.');
    });
  }
  updateOfflineUI();

  try{
    S.me=await api('/api/me');
    try{localStorage.setItem('oasis_cached_me',JSON.stringify(S.me))}catch(e){}
  }catch(e){
    try{S.me=JSON.parse(localStorage.getItem('oasis_cached_me')||'{"username":"operador","role":"OPERATOR"}')}catch(x){S.me={username:'operador',role:'OPERATOR'}}
  }

  try{
    S.products=await api('/api/products');
    try{localStorage.setItem('oasis_cached_products',JSON.stringify(S.products))}catch(e){}
  }catch(e){
    try{S.products=JSON.parse(localStorage.getItem('oasis_cached_products')||'[]')}catch(x){S.products=[]}
  }

  try{
    S.deliveryPersons=await api('/api/delivery-persons');
    try{localStorage.setItem('oasis_cached_delivery_persons',JSON.stringify(S.deliveryPersons))}catch(e){}
  }catch(e){
    try{S.deliveryPersons=JSON.parse(localStorage.getItem('oasis_cached_delivery_persons')||'[]')}catch(x){S.deliveryPersons=[]}
  }

  fillDl();nav();applyNavLayout();
  try{await updatePrinterStatus()}catch(e){}
  await loadOrders();
  let t;
  const connectSse=()=>{
    try{
      const es=new EventSource('/api/stream');
      es.addEventListener('orders',()=>{
        clearTimeout(t);
        t=setTimeout(async()=>{
          if(S.tab==='ops'){try{await updatePrinterStatus();await loadOrders();refreshOpenConvs()}catch(e){}}
        },300);
      });
      es.onerror=()=>{try{es.close()}catch(x){}setTimeout(connectSse,5000)};
    }catch(e){}
  };
  connectSse();
  // Auto-actualización periódica de respaldo (cada 3.5 segundos en operaciones):
  setInterval(async()=>{
    if(S.tab==='ops'&&!loading){try{await updatePrinterStatus();await loadOrders();refreshOpenConvs()}catch(e){}}
  },3500);
  setInterval(()=>document.querySelectorAll('.ago').forEach(x=>{x.textContent=ago(x.dataset.t)}),15000)})();
</script></body></html>
